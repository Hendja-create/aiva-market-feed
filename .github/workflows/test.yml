name: Node.js tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "fix/paginated-demo-tick-history"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install
      - name: Run tests
        run: npm test
